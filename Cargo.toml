# edoCRS workspace —— 按 pi 的分层拆包:
#   edocrs-ai     模型接入 (pi-ai)
#   edocrs-agent  agent 核心 (pi-agent-core)
#   edocrs        coding agent 二进制 (pi-coding-agent): 会话 / 工具 / TUI
#
# 学习点: `resolver = "3"` 是 edition 2024 的默认特性解析器; `[workspace.package]` 让子 crate
#         用 `version.workspace = true` 继承公共字段, 避免三处各写一遍。
[workspace]
resolver = "3"
members = ["crates/edocrs-ai", "crates/edocrs-agent", "crates/edocrs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
