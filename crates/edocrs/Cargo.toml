[package]
name = "edocrs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A demo Claude Code-style agent CLI in Rust"

[[bin]]
name = "edocrs"
path = "src/main.rs"

[dependencies]
# workspace 内部分层
edocrs-ai = { path = "../edocrs-ai" }
edocrs-agent = { path = "../edocrs-agent" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# settings.json 是 JSONC (带注释/尾逗号的 JSON), json5 是它的超集解析器
json5 = "1"

# CLI 参数
clap = { version = "4", features = ["derive"] }

# 错误
thiserror = "1"
anyhow = "1"

# 终端
crossterm = "0.27"
rustyline = "14"

# 工具
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
dotenvy = "0.15"
similar = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
